<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片集首頁</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
            background-color: #f4f4f9;
        }

        h2 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        /* 分類卡片選單容器 */
        .category-menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* 卡片樣式 */
        .category-card {
            background-color: white;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 160px;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: #007bff;
            box-shadow: 0 6px 15px rgba(0,123,255,0.2);
        }

        /* 封面縮圖 */
        .category-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #eee;
        }

        .category-card span {
            font-size: 1.1rem;
            font-weight: bold;
        }

        #statusMessage {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="flex">
        <h2>請選擇圖片集</h2>

    <!-- 動態生成的分類選單容器 -->
    <div class="category-menu" id="categoryContainer">
        <span id="statusMessage">載入分類中...</span>
    </div>
    </div>

    <script src="../index.js"></script>
    <script>
        const url = info[0].url;
        const container = document.getElementById('categoryContainer');

        async function loadCategories() {
            try {
                // const response = await fetch('categories.json');
                // if (!response.ok) throw new Error('讀取 JSON 失敗');
                
                // const categories = await response.json();
                const categories = [
    {
        "folder": "fish",
        "name": "魚照片專區",
        "cover": url+"fish/images/photo001.jpg"
    },{
        "folder": "dogs",
        "name": "狗照片專區",
        "cover": url+"dogs/images/photo001.jpg"
    },
    {
        "folder": "cats",
        "name": "貓照片專區",
        "cover": url+"cats/images/photo001.jpg"
    }
]
                
                // 清空載入中提示
                container.innerHTML = '';

                categories.forEach(cat => {
                    // 建立超連結卡片
                    const card = document.createElement('a');
                    card.href = url+`${cat.folder}/index.html`;
                    card.className = 'category-card';

                    // 建立封面圖片
                    const img = document.createElement('img');
                    img.src = cat.cover;
                    img.alt = cat.name;

                    // 建立文字標籤
                    const span = document.createElement('span');
                    span.textContent = cat.name;

                    // 組合卡片
                    card.appendChild(img);
                    card.appendChild(span);
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = '<span style="color: red;">無法載入分類設定，請確認 categories.json 是否存在。</span>';
            }
        }

        loadCategories();
    </script>

</body>
</html>
