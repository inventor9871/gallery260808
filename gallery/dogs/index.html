<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">載入中...</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        h2 { color: #333; font-size: 1.8rem; }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .back-btn:hover { background-color: #5a6268; }

        #statusMessage { color: #666; margin-bottom: 15px; font-style: italic; }

        .thumbnails {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 每一張圖片與說明的包裝容器 */
        .thumb-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
        }

        .thumbnails img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s, opacity 0.2s;
        }
        .thumbnails img:hover { transform: scale(1.05); opacity: 0.85; }

        /* 圖片下方說明文字的樣式 */
        .thumb-caption {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #555;
            text-align: center;
            word-break: break-all;
        }

        /* 燈箱樣式 */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            touch-action: pan-y;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 80%; max-height: 80vh;
            object-fit: contain; border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        .lightbox .close-btn {
            position: absolute; top: 15px; right: 20px;
            color: #fff; font-size: 35px; font-weight: bold;
            cursor: pointer; z-index: 1000;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.2);
            color: white; border: none; font-size: 24px;
            padding: 12px 16px; cursor: pointer; border-radius: 4px; z-index: 1000;
            user-select: none;
            transition: background-color 0.2s;
        }
        .nav-btn:hover { background-color: rgba(255, 255, 255, 0.5); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        @media (max-width: 768px) {
            .nav-btn {
                font-size: 18px;
                padding: 10px 12px;
            }
            .prev-btn { left: 5px; }
            .next-btn { right: 5px; }
        }
    </style>
</head>
<body>

    <a href="../../index.html" class="back-btn">&#8592; 返回首頁</a>

    <h2 id="pageHeading">載入中...</h2>
    <div id="statusMessage">讀取資料中...</div>

    <div class="thumbnails" id="thumbContainer"></div>

    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
        <img id="lightboxImg" src="" alt="放大圖">
        <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>

    <script>
        const container = document.getElementById('thumbContainer');
        const statusMessage = document.getElementById('statusMessage');
        const pageTitle = document.getElementById('pageTitle');
        const pageHeading = document.getElementById('pageHeading');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentIndex = 0;
        const totalPhotos = 999;
        const imageFolder = 'images/';
        const fileExtension = '.jpg';

        async function loadInfoAndGallery() {
            let infoData = {};
            
            // 1. 讀取 info.json (包含標題與圖片說明)
            try {
                const res = await fetch('info.json');
                if (res.ok) {
                    infoData = await res.json();
                    pageTitle.textContent = infoData.title || '圖片集';
                    pageHeading.textContent = infoData.heading || '圖片集藝廊';
                }
            } catch (e) {
                console.log('找不到 info.json 或格式錯誤，使用預設標題');
                pageTitle.textContent = '圖片集';
                pageHeading.textContent = '圖片集藝廊';
            }

            // 2. 讀取圖片並自動對應說明
            let loadedCount = 0;
            for (let i = 1; i <= totalPhotos; i++) {
                const numStr = String(i).padStart(3, '0');
                const fullPath = `${imageFolder}photo${numStr}${fileExtension}`;

                try {
                    const response = await fetch(fullPath, { method: 'HEAD' });
                    if (response.ok) {
                        loadedCount++;

                        // 建立外層容器
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'thumb-item';

                        // 建立圖片
                        const img = document.createElement('img');
                        img.src = fullPath;
                        img.alt = `照片 ${numStr}`;
                        img.className = 'thumb';

                        img.addEventListener('click', () => {
                            const currentThumbs = document.querySelectorAll('.thumb');
                            const clickedIndex = Array.from(currentThumbs).indexOf(img);
                            if (clickedIndex !== -1) {
                                updateLightbox(clickedIndex);
                                lightbox.classList.add('active');
                            }
                        });

                        itemDiv.appendChild(img);

                        // 檢查 JSON 裡面是否有對應的說明文字
                        if (infoData.captions && infoData.captions[numStr]) {
                            const captionDiv = document.createElement('div');
                            captionDiv.className = 'thumb-caption';
                            captionDiv.textContent = infoData.captions[numStr];
                            itemDiv.appendChild(captionDiv);
                        }

                        container.appendChild(itemDiv);
                    } else {
                        break;
                    }
                } catch (error) {
                    break;
                }
            }
            statusMessage.textContent = loadedCount > 0 ? `共找到 ${loadedCount} 張圖片` : `目前沒有圖片`;
        }

        loadInfoAndGallery();

        function updateLightbox(index) {
            const currentThumbs = document.querySelectorAll('.thumb');
            if (currentThumbs.length === 0) return;
            currentIndex = (index + currentThumbs.length) % currentThumbs.length;
            lightboxImg.src = currentThumbs[currentIndex].src;
        }

        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); updateLightbox(currentIndex - 1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); updateLightbox(currentIndex + 1); });
        
        function closeLightbox() { lightbox.classList.remove('active'); }
        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        let touchStartX = 0;
        let touchEndX = 0;
        lightbox.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        lightbox.addEventListener('touchend', (e) => { 
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) updateLightbox(currentIndex + 1);
            if (touchEndX > touchStartX - 50) updateLightbox(currentIndex - 1);
        }, { passive: true });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowLeft') updateLightbox(currentIndex - 1);
            else if (e.key === 'ArrowRight') updateLightbox(currentIndex + 1);
        });
    </script>
</body>
</html>
